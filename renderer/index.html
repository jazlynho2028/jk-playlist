<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
            default-src 'self'; 
            script-src 'self' https://cdnjs.cloudflare.com; 
            connect-src 'self' https://api.spotify.com;
            img-src 'self' https://i.scdn.co; 
            style-src 'self' https://fonts.googleapis.com;
            font-src 'self' https://fonts.gstatic.com;
            "
    />
    <title>Hello, this will be a cute playlist!</title>
    <link rel="stylesheet" href="./index.css">
  </head>
  <body>
    <div class="container-background">
      <div class="content-container">
        <div class="album-cover-frame">
          <img id="cover-art"></img>
        </div>
        <div class="song-info-container">
          <div class="upper-song-info-container">
            <button>
              <img src="../assets/icons/heart.png" alt="Prev">
            </button>
            <h2 id="song-title">No song selected</h2>
            <button>
              <img src="../assets/icons/heart.png" alt="Prev">
            </button>
          </div>
          <h3 id="artist-name"></h3> 
        </div>
        <div class="audio-controls-container">
          <div class="progress-container">
            <input type="range" id="progress-bar" class="custom-range" min="0" max="100" value="0">
            <div class="time-container">
              <h3 id="current-time">00:00</h3>
              <h3 id="duration">00:00</h3>
            </div>
          </div>
          <div class="controls">
            <button id="prev-btn">
              <img src="../assets/icons/next.png" alt="Prev">
            </button>
            <button id="play-btn">
              <img src="../assets/icons/play-circle.png" alt="Play">
            </button>
            <button id="next-btn">
              <img src="../assets/icons/next.png" alt="Next">
            </button>
          </div>
        </div>
      </div>
    </div>
  
    <audio id="audio-player"></audio>
    
    <script type="module" src="renderer.js"></script>
  </body>
</html>
